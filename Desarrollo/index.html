<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colori | Generador de paletas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    
    <header>
        
        <h1>Colori</h1>
        <p>Encuentra nuevas combinaciones para inspirar tus ideas.</p>
    
    </header>

    <main>

        <section>
         
            <h2>Explora los colores</h2>

            <div class="controles">

    <div class="grupo-generador">

        <div class="selector-cantidad">

    <label for="cantidad-colores">Número de tonos:</label>

    <select name="cantidad-colores" id="cantidad-colores">
        <option value="6">6</option>
        <option value="8">8</option>
        <option value="9">9</option>
    </select>
    

    </div>

        <button type="button" id="generar-paleta">
            Generar paleta
        </button>

    </div>

    <div class="grupo-formato">

    <p>Formato:</p>

    <div class="botones-formato">

        <button type="button" id="formato-hsl">
            HSL
        </button>

        <button type="button" id="formato-hex">
            HEX
        </button>

        </div>

        </div>

        <button type="button" id="guardar-paleta">
        Guardar paleta
    </button>

    </div>

        </section>


        <section class="seccion-paleta">

            <div id="paleta"></div>

        </section>

        <section class="seccion-historial">
    
            <h2>Mis paletas guardadas</h2>
            <div id="historial-paletas"></div>
        
        </section>
            
            

    </main>

    <footer>
        <p>Generador de paletas de colores</p>
    </footer>

</body>
</html>
